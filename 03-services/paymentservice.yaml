apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done']
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: paymentservice
          image: paymentservice:latest
          imagePullPolicy: Never
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb:27017/paymentDB"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: LIQUIBASE_MONGODB_SUPPRESS_CREATE_COLLECTION_ERRORS
              value: "true"
            - name: LOGGING_LEVEL_ORG_APACHE_KAFKA
              value: "WARN"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA
              value: "DEBUG"
            - name: LOGGING_LEVEL_COM_MYMICROSERVICE_PAYMENTSERVICE
              value: "DEBUG"

          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Kubernetes waits for the app to start before starting the readiness/liveness check
          startupProbe:
            tcpSocket:
              port: 8084
            failureThreshold: 40
            periodSeconds: 10
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
spec:
  selector:
    app: paymentservice
  ports:
    - port: 8084
      targetPort: 8084